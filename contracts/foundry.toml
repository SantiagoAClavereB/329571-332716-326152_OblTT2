[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
# El script de deploy escribe las direcciones en la carpeta publica de Angular.
fs_permissions = [{ access = "read-write", path = "../frontend/public" }]

[invariant]
# 64 secuencias de 40 llamadas aleatorias: suficiente para el invariante y rapido para correrlo seguido.
runs = 64
depth = 40
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
